# Spectrum source for the spotify-player plugin.
#
# The Service.qml singleton runs `cava -p <plugin dir>/cava.conf` while media
# is playing and parses the raw ASCII stream on stdout: nine bands ordered
# low -> high frequency, each 0-1000, ';' (59) between bands, '\n' (10)
# between frames. Everything here exists to make that stream stable.
#
# input: PipeWire monitor of the default output sink — the mix the user
# actually hears. `virtual` avoids the desktop's recording indicator and
# `active` keeps monitor buffers flowing even when no app is playing, so
# silence renders as explicit zero frames instead of a stalled stream.

[general]
framerate = 25
bars = 9
autosens = 1
# 60 Hz floor keeps infrasonic rumble out of band one; the 12 kHz ceiling
# keeps the top bands on musical content instead of hiss.
lower_cutoff_freq = 60
higher_cutoff_freq = 12000
# Stop FFT-ing after one second of silence; wake on input. The service also
# stops the child outright on pause, this covers the gap cases.
sleep_timer = 1

[input]
method = pipewire
source = auto
active = 1
virtual = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
# One left-to-right spectrum, not mirrored stereo.
channels = mono
mono_option = average

[smoothing]
noise_reduction = 65
