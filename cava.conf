# Spectrum source for the spotify-player plugin.
#
# The Service.qml singleton runs one supervised `cava -p <plugin dir>/cava.conf`
# process while playing and for a bounded five-second warm window after pause.
# It parses raw ASCII stdout as nine bars ordered low -> high frequency, each
# 0-1000, with ';' (59) between bands and '\n' (10) between frames.
#
# input: PipeWire monitor of the default output sink — the mix the user
# actually hears. `virtual` avoids the desktop's recording indicator and
# `active` keeps monitor buffers flowing even when no app is playing, so
# silence renders as explicit zero frames instead of a stalled stream.

[general]
framerate = 60
bars = 9
autosens = 1
# 60 Hz floor keeps infrasonic rumble out of band one; the 12 kHz ceiling
# keeps the top bands on musical content instead of hiss.
lower_cutoff_freq = 60
higher_cutoff_freq = 12000
# The service bounds the process lifetime after pause. Disabling Cava's
# one-second sleep polling keeps every frame immediately available while the
# selected player is active or the short prewarm/linger window is open.
sleep_timer = 0

[input]
method = pipewire
source = auto
active = 1
virtual = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
# One left-to-right spectrum, not mirrored stereo.
channels = mono
mono_option = average

[smoothing]
noise_reduction = 25
